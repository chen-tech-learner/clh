name: 每7天更新iptv
on:
  schedule:
    - cron: '0 2 * * 0'
  workflow_dispatch:

jobs:
  run_task:
    runs-on: ubuntu‑latest
    permissions:
      contents: write

    steps:
      - name: 拉取仓库代码
        uses: actions/checkout@v4

      - name: 安装Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 安装依赖
        run: pip install requests
      - name: 执行更新脚本
        run: python run.py

      - name: 提交更新m3u文件
        run: |
          git config --global user.name "github‑actions[bot]"
          git config --global user.email "github‑actions[bot]@users.noreply.github.com"
          git add *.m3u
          git commit -m "auto update m3u $(date)" || echo "无内容更新跳过提交"
          git push
